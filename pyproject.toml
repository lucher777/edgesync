[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesync"
version = "0.1.0"
description = "Static-memory clock synchronization and four-tap Farrow resampling kernel for wearable sensors (freestanding C11)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Kang Liu", email = "peacekange@gmail.com"},
]
keywords = [
    "embedded-systems",
    "clock-synchronization",
    "farrow-filter",
    "fractional-delay",
    "wearable-sensors",
    "static-memory",
    "real-time",
    "c11",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
edgesync = "edgesync.cli:main"

[project.urls]
Homepage = "https://github.com/lucher777/edgesync"
Repository = "https://github.com/lucher777/edgesync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
