name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c11-and-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build freestanding C11 microkernel and audit zero-heap symbols
        run: |
          make all
          make audit
          test -z "$(nm -u csrc/edgesync.o)"
      - name: Install Python test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Run full pytest suite
        env:
          PYTHONPATH: src
        run: pytest -v
